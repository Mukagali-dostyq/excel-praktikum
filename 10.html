<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Excel Практикум · 10 класс</title>
<style>
:root{--g:#217346;--g2:#185c37;--gl:#e9f3ec;--grid:#e1e1e1;--hd:#f3f3f3;--hs:#d3e7da;--txt:#1f1f1f;--muted:#666;--bad:#d93025;--ok:#1e8e3e;--warn:#e37400}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:#fff}
body{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
input{font:inherit}
.btn{border:1px solid #c8c8c8;background:#fff;border-radius:6px;padding:6px 14px;color:var(--txt)}
.btn:hover{background:#f2f2f2}
.btn.primary{background:var(--g);border-color:var(--g);color:#fff}
.btn.primary:hover{background:var(--g2)}
.btn.big{padding:11px 22px;font-size:16px;font-weight:600}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;padding:4px 12px}
.btn.light:hover{background:rgba(255,255,255,.26)}
.xl{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:9px;background:var(--g);color:#fff;font:700 26px/1 "Segoe UI",Arial,sans-serif;box-shadow:inset -10px 0 0 rgba(0,0,0,.12)}
.xl.sm{width:26px;height:26px;font-size:15px;border-radius:5px;background:#fff;color:var(--g);box-shadow:none}
.langs{display:inline-flex;border:1px solid rgba(0,0,0,.15);border-radius:6px;overflow:hidden}
.langs button{border:0;background:transparent;padding:4px 10px;font-weight:600;color:inherit;opacity:.65}
.langs button.on{background:rgba(0,0,0,.08);opacity:1}
.top .langs{border-color:rgba(255,255,255,.35)}
.top .langs button.on{background:rgba(255,255,255,.22)}

/* start */
.screen{position:fixed;inset:0}
#start,#result{background:linear-gradient(135deg,#123f27,#217346 55%,#33a36a);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
.card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:26px 28px;width:100%;max-width:560px;margin:auto}
.start-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.start-head h1{margin:0;font-size:26px}
.start-head p{margin:2px 0 0;color:var(--muted)}
.start-top{display:flex;justify-content:flex-end;margin-bottom:6px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid #c8c8c8;border-radius:8px;font-size:16px}
.field input:focus{outline:2px solid var(--g);border-color:transparent}
.rules{margin:16px 0;padding:12px 14px 12px 32px;background:var(--gl);border-radius:10px;font-size:14px;line-height:1.45}
.rules li{margin:4px 0}
.err-msg{color:var(--bad);min-height:20px;font-size:14px}
.tiny{font-size:12px;color:var(--muted);margin:12px 0 0}
.linkbtn{border:0;background:none;color:var(--g);text-decoration:underline;padding:0;font-size:12px}

/* work */
#work{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;background:var(--g);color:#fff;padding:6px 12px;min-height:44px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.who{opacity:.9;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.pill{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 10px;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.pill.warn{background:#fbbc04;color:#3c2a00;font-weight:700}
.tools{display:flex;gap:2px;align-items:stretch;background:#f8f8f8;border-bottom:1px solid #ddd;padding:4px 8px;overflow-x:auto;scrollbar-width:thin}
.tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 8px;min-width:58px;font-size:11.5px;color:#333;white-space:nowrap}
.tools button b{font-size:17px;line-height:18px;font-weight:600;color:var(--g)}
.tools button:hover{background:#e9e9e9}
.tools button.on{background:var(--hs);border-color:#9cc9ad}
.tools .sep{width:1px;background:#ddd;margin:3px 4px}
.fbar{display:flex;align-items:center;border-bottom:1px solid #d4d4d4;height:32px;background:#fff}
#nameBox{width:86px;height:100%;border:0;border-right:1px solid #d4d4d4;padding:0 8px;font-size:13px;text-align:center}
.fxbtns{display:flex;align-items:center;border-right:1px solid #d4d4d4;height:100%;padding:0 4px}
.fxbtns button{border:0;background:none;width:26px;height:26px;color:#777;font-size:14px;border-radius:4px}
.fxbtns button:hover{background:#eee}
.fxbtns #fxFn{font-style:italic;font-family:Georgia,serif;font-weight:700;color:#555}
#fx{flex:1;height:100%;border:0;padding:0 8px;font-size:14px;font-family:Consolas,"Cascadia Mono",monospace;min-width:0}
#fx:focus,#nameBox:focus{outline:none;background:#fbfffc}
.main{flex:1;display:flex;min-height:0}
#gridWrap{flex:1;overflow:auto;position:relative;background:#fff;outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#gridInner{position:relative;display:inline-block;min-width:100%}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13.5px}
#grid th,#grid td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);height:24px;padding:0 5px;white-space:nowrap;overflow:hidden;cursor:cell}
#grid thead th{position:sticky;top:0;background:var(--hd);z-index:4;font-weight:400;color:#555;text-align:center;font-size:12.5px;border-color:#d6d6d6}
#grid tbody th{position:sticky;left:0;background:var(--hd);z-index:3;font-weight:400;color:#555;text-align:center;font-size:12.5px;border-color:#d6d6d6}
#grid thead th.corner{left:0;z-index:5}
#grid th.hs{background:var(--hs);color:var(--g2);font-weight:700;box-shadow:inset 0 -2px 0 var(--g)}
#grid tbody th.hs{box-shadow:inset -2px 0 0 var(--g)}
#grid td.num{text-align:right}
#grid td.c{text-align:center}
#grid td.err{text-align:center;color:#c5221f;font-weight:600}
#grid td.h{background:#e3efe7;font-weight:700;white-space:normal;line-height:1.15;text-align:center;padding:3px 4px;color:#163d27}
#grid td.lbl{background:#fafafa;white-space:normal;line-height:1.15;padding:2px 5px}
#grid td.p{background:#e8f1fb;font-weight:700}
#grid td.t{background:#fff9e0}
#grid td.insel{background-image:linear-gradient(rgba(33,115,70,.14),rgba(33,115,70,.14))}
#grid td.bad{box-shadow:inset 0 0 0 2px rgba(217,48,37,.6)}
.ov{position:absolute;pointer-events:none;z-index:2}
#selBox{border:2px solid var(--g);margin:-1px 0 0 -1px}
#copyBox{border:2px dashed var(--g);animation:ants 0.6s linear infinite;margin:-1px 0 0 -1px}
@keyframes ants{50%{border-color:#7fbf98}}
#fillBox{border:2px dashed #777;margin:-1px 0 0 -1px}
#tmenu{position:absolute;z-index:6;display:flex;flex-wrap:wrap;gap:4px;max-width:min(330px,88vw);background:#fff;border:1px solid #cfd8d2;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.18);padding:5px}
#tmenu button{font:inherit;font-size:14px;border:0;background:#f2f6f3;border-radius:7px;padding:9px 11px;cursor:pointer;color:#163d27;white-space:nowrap}
#tmenu button.main{background:var(--g);color:#fff;font-weight:600}
#tmenu button:active{filter:brightness(.92)}
#fillPickBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#163d27;color:#fff;border-radius:22px;padding:10px 16px;font-size:15px;box-shadow:0 6px 22px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:92vw}
#fillPickBar button{font:inherit;border:0;border-radius:14px;padding:5px 12px;background:#fff;color:#163d27;cursor:pointer}
.refbox{position:absolute;pointer-events:none;z-index:2;border:2px solid;margin:-1px 0 0 -1px}
#fillHandle{position:absolute;width:9px;height:9px;background:var(--g);border:1.5px solid #fff;z-index:3;cursor:crosshair;touch-action:none}
@media (pointer:coarse){#fillHandle{width:18px;height:18px;border-radius:50%;margin:-5px 0 0 -5px}}
#cellEd{position:absolute;z-index:6;border:2px solid var(--g);margin:-1px 0 0 -1px;padding:0 4px;font-size:13.5px;outline:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#panel{width:350px;flex:none;border-left:1px solid #d4d4d4;overflow:auto;background:#fcfcfc;padding:14px 16px 24px;font-size:14.5px;line-height:1.45}
#panel.closed{display:none}
.pnum{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--g);font-weight:700}
#panel h2{margin:2px 0 8px;font-size:20px;line-height:1.2}
.ptext p{margin:6px 0}
.ptext ol{padding-left:22px;margin:8px 0}
.ptext li{margin:7px 0}
.ptext code,.res code{font-family:Consolas,monospace;font-size:13px;background:#e3efe7;color:#174a2c;padding:0 4px;border-radius:4px;white-space:nowrap}
.ptext .note{background:#fff4e0;border-left:3px solid var(--warn);padding:6px 10px;border-radius:4px;font-size:13.5px}
.checkbar{display:flex;gap:8px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.score{font-size:15px}
.score b{font-size:18px;color:var(--g)}
.res{list-style:none;padding:0;margin:8px 0}
.res li{display:flex;gap:8px;padding:6px 8px;border-radius:6px;margin:3px 0;font-size:13.5px;line-height:1.35;background:#f3f3f3}
.res li.ok{background:#e6f4ea}
.res li.wrong,.res li.noformula,.res li.samefail{background:#fce8e6}
.res li.fragile{background:#fef7e0}
.res li.partial{background:#fff4d6}
.res li.partial .ic{color:#b06000}
.res .rt{flex:1}
.res .pt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:#444;white-space:nowrap}
.rub{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.rub td{border-bottom:1px solid #eee;padding:3px 6px;vertical-align:top}
.rub td.n{text-align:right}
.res .ic{font-weight:700;width:16px;flex:none;text-align:center}
.res li.ok .ic{color:var(--ok)} .res li.wrong .ic,.res li.noformula .ic,.res li.samefail .ic{color:var(--bad)} .res li.fragile .ic{color:var(--warn)} .res li.empty .ic{color:#999}
.res small{color:#666}
.about{font-size:12.5px;color:var(--muted);border-top:1px solid #e5e5e5;padding-top:8px;margin-top:14px}
#tabs{display:flex;align-items:stretch;background:#f0f0f0;border-top:1px solid #d4d4d4;height:34px;overflow-x:auto;padding:0 8px;scrollbar-width:thin;flex:none}
.tab{border:0;border-right:1px solid #d9d9d9;background:transparent;padding:0 14px;font-size:13.5px;color:#333;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{background:#e6e6e6}
.tab.on{background:#fff;color:var(--g);font-weight:700;box-shadow:inset 0 -3px 0 var(--g)}
.tab i{font-style:normal;font-size:11px;background:#ddd;border-radius:9px;padding:0 6px;color:#444;font-weight:600}
.tab i.ok{background:var(--ok);color:#fff}
.status{display:flex;align-items:center;gap:16px;background:#f3f3f3;border-top:1px solid #ddd;height:24px;padding:0 12px;font-size:12.5px;color:#444;flex:none}
#stats span{margin-left:14px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(15,30,20,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.lockcard{text-align:center;max-width:460px}
.lock-ic{font-size:44px;line-height:1}
.lockcard h2{margin:8px 0}
.lockcard input{padding:10px;border:1px solid #c8c8c8;border-radius:8px;font-size:18px;text-align:center;width:200px;letter-spacing:.2em;margin:6px 0}
#modal .card{max-width:640px;max-height:86vh;display:flex;flex-direction:column}
#mBody{overflow:auto;margin:10px 0;font-size:14.5px;line-height:1.45}
#mFoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mTitle{margin:0;font-size:20px}
.fnlist{list-style:none;padding:0;margin:8px 0}
.fnlist li{padding:7px 8px;border-bottom:1px solid #eee;cursor:pointer;border-radius:5px}
.fnlist li:hover{background:var(--gl)}
.fnlist b{color:var(--g)}
.fnlist code{font-family:Consolas,monospace;font-size:13px;color:#333}
.fnlist small{color:#888}
.fnlist li{cursor:default}
.fnlist li.star{background:#f3fbf6}
.fnlist li.open{background:#fff;box-shadow:inset 3px 0 0 var(--g)}
.fnhead{cursor:pointer}
.fnstar{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--g);border-radius:9px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.fnbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fnbtns button{font:inherit;font-size:12.5px;border:1px solid #cfd8d2;background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer}
.fnbtns .fnmore{color:var(--g);font-weight:600}
.fnbtns button:hover{background:var(--gl)}
.fndet{margin:8px 0 2px;padding:9px 11px;background:#fbfcfb;border:1px solid #e3e9e5;border-radius:7px;font-size:13.5px;line-height:1.5}
.fndet p{margin:4px 0}
.fndet .fnh{font-weight:700;color:#2b5d3f;margin-top:8px}
.fndet .fnbad{color:#b3261e}
.fndet ul.fnargs{margin:4px 0;padding-left:18px}
.fndet ul.fnargs li{border:0;padding:2px 0;cursor:default}
.fndet ul.fnargs li:hover{background:none}
.fnex{margin:3px 0}
.fndet code{background:#eef4f0;border-radius:4px;padding:0 4px}
.fnsearch{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:7px}
.sol{font-family:Consolas,monospace;font-size:13px;background:#f6f6f6;border-radius:6px;padding:8px;margin:4px 0 12px;white-space:pre-wrap;word-break:break-all}
#sink{position:fixed;left:-60px;top:0;width:2px;height:2px;opacity:0;border:0;padding:0}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.ok{background:var(--ok)} #toast.bad{background:var(--bad)}

/* results */
.rescard{max-width:720px}
.res-head{display:flex;gap:14px;align-items:center}
.res-head h1{margin:0;font-size:24px}
.res-head p{margin:2px 0 0;color:var(--muted)}
.grade{margin-left:auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;color:#fff;background:var(--g);flex:none}
.grade.g4{background:#1a73e8}.grade.g3{background:var(--warn)}.grade.g2{background:var(--bad)}
.res-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0;font-size:14px;color:#444}
.restab{width:100%;border-collapse:collapse;font-size:14.5px}
.restab th,.restab td{padding:7px 8px;border-bottom:1px solid #eee;text-align:left}
.restab td.n{text-align:right;font-variant-numeric:tabular-nums}
.restab tr.tot td{font-weight:700;border-top:2px solid #333}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--g)}
.viol{margin:14px 0;padding:10px 12px;background:#fff4e0;border-radius:8px;font-size:13.5px}
.viol.none{background:#e6f4ea}
.res-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

@media (max-width:900px){
  .main{flex-direction:column}
  #panel{width:auto;max-height:42%;border-left:0;border-top:2px solid var(--g);order:2}
  .who{display:none}
}
@media (max-width:640px){
  .brand span:last-child{display:none}
  .tools button{min-width:44px;font-size:0}
  .tools button b{font-size:18px}
  #nameBox{width:60px}
}
</style>
</head>
<body>

<!-- ===================== START ===================== -->
<section id="start" class="screen">
  <div class="card">
    <div class="start-top"><div class="langs"><button data-lang="ru">RU</button><button data-lang="kz">ҚАЗ</button></div></div>
    <div class="start-head"><span class="xl">X</span><div><h1 data-i="appTitle"></h1><p data-i="appSub"></p></div></div>
    <label class="field"><span data-i="lblName"></span><input id="stName" autocomplete="off" maxlength="60"></label>
    <label class="field"><span data-i="lblClass"></span><input id="stClass" autocomplete="off" maxlength="12" placeholder="11 А"></label>
    <ul class="rules" id="rules"></ul>
    <div id="startErr" class="err-msg"></div>
    <button id="btnStart" class="btn primary big" data-i="start"></button>
    <p class="tiny"><span data-i="offlineNote"></span> <span id="fsWarn"></span></p>
    <p class="tiny"><button class="linkbtn" id="btnTeacher" data-i="teacher"></button></p>
  </div>
</section>

<!-- ===================== WORK ===================== -->
<section id="work" class="screen" hidden>
  <header class="top">
    <div class="brand"><span class="xl sm">X</span><span data-i="appTitle"></span></div>
    <div class="who" id="who"></div>
    <div class="spacer"></div>
    <div class="pill" id="timer">0:00</div>
    <div class="pill warn" id="viol" hidden></div>
    <div class="langs"><button data-lang="ru">RU</button><button data-lang="kz">ҚАЗ</button></div>
    <button class="btn light" id="btnPanel" data-i="taskBtn"></button>
    <button class="btn light" id="btnFinish" data-i="finish"></button>
  </header>
  <div class="tools" id="tools">
    <button data-act="undo"><b>↶</b><span data-i="undo"></span></button>
    <button data-act="redo"><b>↷</b><span data-i="redo"></span></button>
    <div class="sep"></div>
    <button data-act="copy"><b>⧉</b><span data-i="copy"></span></button>
    <button data-act="paste"><b>⎘</b><span data-i="paste"></span></button>
    <button data-act="clear"><b>⌫</b><span data-i="clear"></span></button>
    <div class="sep"></div>
    <button data-act="fillDown"><b>⇩</b><span data-i="fillDown"></span></button>
    <button data-act="fillRight"><b>⇨</b><span data-i="fillRight"></span></button>
    <button data-act="abs"><b>$</b><span data-i="abs"></span></button>
    <button data-act="range" id="btnRange"><b>⬚</b><span data-i="range"></span></button>
    <div class="sep"></div>
    <button data-act="funcs" id="btnFuncs"><b>ƒx</b><span data-i="funcs"></span></button>
  </div>
  <div class="fbar">
    <input id="nameBox" spellcheck="false" autocomplete="off">
    <div class="fxbtns"><button id="fxCancel" title="Esc">✕</button><button id="fxOk" title="Enter">✓</button><button id="fxFn">fx</button></div>
    <input id="fx" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">
  </div>
  <div class="main">
    <div id="gridWrap" tabindex="-1">
      <div id="gridInner">
        <table id="grid"></table>
        <div id="refBoxes"></div>
        <div id="copyBox" class="ov" hidden></div>
        <div id="selBox" class="ov"></div>
        <div id="fillBox" class="ov" hidden></div>
        <div id="fillHandle"></div>
        <input id="cellEd" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" hidden>
      </div>
    </div>
    <aside id="panel"></aside>
  </div>
  <nav id="tabs"></nav>
  <footer class="status"><span id="mode"></span><span class="spacer"></span><span id="stats"></span></footer>
</section>

<!-- ===================== RESULT ===================== -->
<section id="result" class="screen" hidden></section>

<!-- ===================== LOCK ===================== -->
<div id="lock" class="overlay" hidden>
  <div class="card lockcard">
    <div class="lock-ic">⏸</div>
    <h2 id="lkTitle"></h2>
    <p id="lkReason"></p>
    <p id="lkCount" style="font-weight:700"></p>
    <div id="lkPinWrap" hidden>
      <p id="lkPinMsg"></p>
      <input id="lkPin" type="password" inputmode="numeric" autocomplete="off"><div id="lkPinErr" class="err-msg"></div>
    </div>
    <button id="lkBtn" class="btn primary big"></button>
  </div>
</div>

<!-- ===================== MODAL ===================== -->
<div id="modal" class="overlay" hidden>
  <div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mFoot"></div></div>
</div>
<div id="toast" hidden></div>
<input id="sink" aria-hidden="true" tabindex="-1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

<script>
(function(){
'use strict';

/* ====================================================================
   НАСТРОЙКИ ДЛЯ УЧИТЕЛЯ / МҰҒАЛІМГЕ АРНАЛҒАН БАПТАУЛАР
   ==================================================================== */

  TEACHER_PIN: '2577',      // PIN-код учителя (разблокировка, сброс, ответы)

function colIdx(s){ let n = 0; for (const ch of s) n = n*26 + (ch.charCodeAt(0) - 64); return n - 1; }
const A = (c, r) => colName(c) + (r + 1);
function P(a){ const m = /^([A-Z]+)(\d+)$/.exec(a); return {c: colIdx(m[1]), r: +m[2] - 1}; }
function addrs(rs){ const [a, b] = rs.split(':'); const p = P(a), q = P(b || a); const o = []; for (let r = Math.min(p.r,q.r); r <= Math.max(p.r,q.r); r++) for (let c = Math.min(p.c,q.c); c <= Math.max(p.c,q.c); c++) o.push(A(c, r)); return o; }

/* ==================== FORMULA ENGINE ==================== */
class XErr { constructor(code){ this.code = code; } }
const ER = {div:'#ДЕЛ/0!', val:'#ЗНАЧ!', name:'#ИМЯ?', ref:'#ССЫЛКА!', na:'#Н/Д', num:'#ЧИСЛО!', cyc:'#ЦИКЛ!'};
const isErr = v => v instanceof XErr;
const NOTL = 'A-Z0-9_.А-ЯЁӘҒҚҢӨҰҮҺІ';
const RX_REF = new RegExp('^(\\$?)([A-Z]{1,2})(\\$?)([0-9]{1,5})(?![' + NOTL + '(])');
const RX_COLS = new RegExp('^(\\$?)([A-Z]{1,2}):(\\$?)([A-Z]{1,2})(?![' + NOTL + '(])');
const RX_ID = /^[A-Z_А-ЯЁӘҒҚҢӨҰҮҺІ][A-Z0-9_.А-ЯЁӘҒҚҢӨҰҮҺІ]*/;
const RXG_REF = () => new RegExp('(^|[^' + NOTL + '$])(\\$?)([A-Z]{1,2})(\\$?)([0-9]{1,5})(?![' + NOTL + '(])', 'g');
const RXG_COLS = () => new RegExp('(^|[^' + NOTL + '$])(\\$?)([A-Z]{1,2}):(\\$?)([A-Z]{1,2})(?![' + NOTL + '(])', 'g');
const BOOLS = {TRUE:true, FALSE:false, 'ИСТИНА':true, 'ЛОЖЬ':false};
const CYR2LAT = {'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','Р':'P','Т':'T','Х':'X','О':'O'};

const splitStr = f => f.split(/("(?:[^"]|"")*"?)/);
function normalizeFormula(f){
  const re = new RegExp('(^|[^' + NOTL + '$])(\\$?)([A-ZАВСЕНКМРТХО]{1,2})(\\$?)([0-9]{1,5})(?![' + NOTL + '(])', 'g');
  return splitStr(f).map((seg, i) => i % 2 ? seg : seg.toUpperCase().replace(re, (m, pre, d1, let_, d2, dig) => pre + d1 + let_.replace(/[АВСЕНКМРТХО]/g, ch => CYR2LAT[ch]) + d2 + dig)).join('');
}
function mapRefs(f, cellFn, colsFn){
  return splitStr(f).map((seg, i) => {
    if (i % 2) return seg;
    seg = seg.replace(RXG_REF(), (m, pre, ca, cl, ra, rw) => pre + cellFn(!!ca, colIdx(cl), !!ra, +rw - 1));
    if (colsFn) seg = seg.replace(RXG_COLS(), (m, pre, a1, c1, a2, c2) => pre + colsFn(!!a1, colIdx(c1), !!a2, colIdx(c2)));
    return seg;
  }).join('');
}
function shiftFormula(f, dr, dc){

  const re = new RegExp('(^|[^' + NOTL + '$])\\$?([A-Z]{1,2})\\$?([0-9]{1,5})(?::\\$?([A-Z]{1,2})\\$?([0-9]{1,5}))?(?![' + NOTL + '(])', 'g');
  splitStr(normalizeFormula(v)).forEach((seg, k) => { if (k % 2) return; let m;
    while ((m = re.exec(seg))){
      let c1 = colIdx(m[2]), r1 = +m[3] - 1, c2 = m[4] ? colIdx(m[4]) : c1, r2 = m[5] ? +m[5] - 1 : r1;
      const R = {r1:Math.min(r1, r2), r2:Math.min(Math.max(r1, r2), tk.rows - 1), c1:Math.min(c1, c2), c2:Math.min(Math.max(c1, c2), tk.cols - 1)};
      if (R.r1 >= tk.rows || R.c1 >= tk.cols) continue;
      const d = document.createElement('div'); d.className = 'refbox'; const col_ = REF_COLORS[i++ % REF_COLORS.length];
      d.style.borderColor = col_; d.style.background = col_ + '1a'; place(d, R); box.appendChild(d);
    } });
}
function toggleAbs(){
  if (!ed) return; const inp = ed.input;
  if (inp.value[0] === '='){ const p0 = caretOf(inp); inp.value = normalizeFormula(inp.value); try { inp.setSelectionRange(p0, p0); } catch (e){} }
  const v = inp.value, pos = caretOf(inp);
  const re = /(\$?)([A-Z]{1,2})(\$?)([0-9]{1,5})/g; let m, best = null;
  while ((m = re.exec(v))){ const prev = v[m.index - 1] || ''; if (/[A-Z0-9_.А-ЯЁ$]/i.test(prev) && prev !== '$') continue; if (m.index <= pos) best = m; }
  if (!best) return;
  const ca = !!best[1], ra = !!best[3]; let nr;
  if (!ca && !ra) nr = '$' + best[2] + '$' + best[4]; else if (ca && ra) nr = best[2] + '$' + best[4]; else if (!ca && ra) nr = '$' + best[2] + best[4]; else nr = best[2] + best[4];
  const s = best.index, e2 = s + best[0].length;
  inp.value = v.slice(0, s) + nr + v.slice(e2); syncFrom(inp); pointRange = null;
  inp.focus({preventScroll:true}); try { inp.setSelectionRange(s + nr.length, s + nr.length); } catch (e){}
  placeEditor(); updRefBoxes(); setMode();
}

/* ---------- fill / copy / paste ---------- */
function seriesInfo(raws){
  if (raws.length < 2) return null; const n = raws.map(r => r[0] === '=' ? null : parseNum(r)); if (n.some(x => x === null)) return null;
  const step = n[1] - n[0]; for (let i = 2; i < n.length; i++) if (Math.abs(n[i] - n[i-1] - step) > 1e-9) return null;
  return {first:n[0], step};
}
function doFill(s, d){
  const changes = [];
  const vertical = d.r1 < s.r1 || d.r2 > s.r2;
  if (vertical){
    const h = s.r2 - s.r1 + 1;
    for (let c = s.c1; c <= s.c2; c++){
      const ser = seriesInfo(range(s.r1, s.r2).map(r => getRaw(A(c, r))));
      for (let r = d.r1; r <= d.r2; r++){ if (r >= s.r1 && r <= s.r2) continue;
        const k = r - s.r1, sr = s.r1 + ((k % h) + h) % h, raw = getRaw(A(c, sr));
        changes.push({a:A(c, r), v: raw[0] === '=' ? shiftFormula(raw, r - sr, 0) : ser ? fmtNum(rnd(ser.first + ser.step*k, 10)) : raw}); }
    }
  } else {
    const w = s.c2 - s.c1 + 1;
    for (let r = s.r1; r <= s.r2; r++){
      const ser = seriesInfo(range(s.c1, s.c2).map(c => getRaw(A(c, r))));
      for (let c = d.c1; c <= d.c2; c++){ if (c >= s.c1 && c <= s.c2) continue;
        const k = c - s.c1, sc_ = s.c1 + ((k % w) + w) % w, raw = getRaw(A(sc_, r));
        changes.push({a:A(c, r), v: raw[0] === '=' ? shiftFormula(raw, 0, c - sc_) : ser ? fmtNum(rnd(ser.first + ser.step*k, 10)) : raw}); }
    }
  }
  setCells(changes);
}
function fillDown(){ if (!canEdit()) return; if (ed && !commitEdit()) return; const R = rng(); if (R.r1 === R.r2){ if (R.r1 === 0) return; doFill({...R, r1:R.r1 - 1, r2:R.r1 - 1}, {...R, r1:R.r1 - 1}); } else doFill({...R, r2:R.r1}, R); }
function fillRight(){ if (!canEdit()) return; if (ed && !commitEdit()) return; const R = rng(); if (R.c1 === R.c2){ if (R.c1 === 0) return; doFill({...R, c1:R.c1 - 1, c2:R.c1 - 1}, {...R, c1:R.c1 - 1}); } else doFill({...R, c2:R.c1}, R); }
function fillDouble(){
  const R = rng(), tk = cur(); const nonEmpty = (r, c) => c >= 0 && c < tk.cols && VALS[r] && VALS[r][c] !== null && VALS[r][c] !== '';
  let adj = -1; if (nonEmpty(R.r2 + 1, R.c1 - 1)) adj = R.c1 - 1; else if (nonEmpty(R.r2 + 1, R.c2 + 1)) adj = R.c2 + 1; if (adj < 0) return;
  let last = R.r2; while (last + 1 < tk.rows && nonEmpty(last + 1, adj)) last++;
  if (last > R.r2){ doFill(R, {...R, r2:last}); sel = {ar:R.r1, ac:R.c1, fr:last, fc:R.c2}; drawSel(); }
}
function copySel(){ if (ed) return; const R = rng(), raws = []; for (let r = R.r1; r <= R.r2; r++){ const row = []; for (let c = R.c1; c <= R.c2; c++) row.push(getRaw(A(c, r))); raws.push(row); } clip = {...R, raws, si:S.cur}; drawSel(); }
function pasteClip(){
  if (!clip || !canEdit()) return; if (ed && !commitEdit()) return;
  const R = rng(), tk = cur(), h = clip.raws.length, w = clip.raws[0].length, list = [];
  for (let i = 0; i < h; i++) for (let j = 0; j < w; j++){ const r = R.r1 + i, c = R.c1 + j; if (r >= tk.rows || c >= tk.cols) continue; const raw = clip.raws[i][j]; list.push({a:A(c, r), v: raw[0] === '=' ? shiftFormula(raw, r - (clip.r1 + i), c - (clip.c1 + j)) : raw}); }
  setCells(list); sel = {ar:R.r1, ac:R.c1, fr:Math.min(R.r1 + h - 1, tk.rows - 1), fc:Math.min(R.c1 + w - 1, tk.cols - 1)}; drawSel();
}

/* ---------- pointer events ---------- */
function cellAt(x, y){ const el = document.elementFromPoint(x, y); const td = el && el.closest && el.closest('#grid td'); return td ? {r:+td.dataset.r, c:+td.dataset.c} : null; }
$('grid').addEventListener('pointerdown', e => {
  if (!canEdit()) return;

    e.preventDefault(); if (ed && !commitEdit()) return; const tk = cur();
    if (th.classList.contains('ch')){ const c = +th.dataset.c; sel = {ar:0, ac:c, fr:tk.rows - 1, fc:c}; }

  useSink = !touch;
  const ae = document.activeElement; if (touch && ae && ae !== document.body && ae.blur) ae.blur();

  else {

    sel = {ar:r, ac:c, fr:r, fc:c}; if (rangeMode) rangeAnchorSet = true;

/* ---------- сенсорные устройства: меню по тапу (как в Google Таблицах) ----------

let lastTap = null, tmenuT = 0, fillPick = null;

  m.style.left = Math.max(x0, Math.min(b.l, x1)) + 'px'; m.style.top = (b.t + b.h + 6) + 'px';

function startFillPick(){

const ARROWS = {ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1]};
document.addEventListener('keydown', e => {
  if (!$('modal').hidden){ if (e.key === 'Escape') closeModal(); return; }
  if ($('work').hidden || S.locked || S.finished) return;
  const tg = e.target;

    if (e.key === 'Enter'){ e.preventDefault(); commitEdit(e.shiftKey ? -1 : 1, 0); return; }
    if (e.key === 'Tab'){ e.preventDefault(); commitEdit(0, e.shiftKey ? -1 : 1); return; }

    return;

/* ==================== PANEL / TABS ==================== */
const ICON = {ok:'✓', partial:'◐', wrong:'✗', noformula:'✗', samefail:'✗', fragile:'!', empty:'○'};
function itemView(it){
  if (it.status === 'ok' && it.q && it.q.length) return {cls:'partial', msg:it.q.map(q => t('q_' + q)).join('; '), bad:it.qbad};

  h += `</div>`;
  if (res){
    h += '<ul class="res">' + res.items.map((it, i) => { const ch = tk.checks[i], vw = itemView(it);
      const cells = vw.bad && vw.bad.length ? `<br><small>${t('badCells')}${vw.bad.slice(0, 8).join(', ')}${vw.bad.length > 8 ? ' …' : ''}</small>` : '';
      return `<li class="${vw.cls}"><span class="ic">${ICON[vw.cls]}</span><span class="rt"><code>${ch.cells}</code> ${esc(tr(ch.name))} — ${vw.msg}${cells}</span><span class="pt">${fmtPts(it.pts || 0)}/${fmtPts(ch.p)}</span></li>`; }).join('') + '</ul>';

    [{label:t('cancel')}, {label:t('ok'), cls:'primary', onClick:() => { if ($('pinIn').value !== CONFIG.TEACHER_PIN){ $('pinErr').textContent = t('pinWrong'); return false; } setTimeout(onOk, 0); }}]);
  const inp = $('pinIn'); inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('mFoot').lastChild.click(); });
}

/* function reference — Практикум 3: полный список (все функции, которые понимает движок),
   у каждой кнопка «Подробнее»: что писать в каждый аргумент, пример с ответом, частая ошибка.
   ★ — функции Дня 3 (идут первыми). Элементы без n — справка без вставки (знаки, $). */
const FX = (ru, kz) => L(ru, kz);
const AR = (rows) => '<ul class="fnargs">' + rows.map(([a, t]) => `<li><code>${a}</code> — ${t}</li>`).join('') + '</ul>';
const D = (o) => {
  const P = (lang) => {
    const ru = lang === 'ru';
    let h = '';
    if (o.what) h += `<p>${o.what[lang]}</p>`;
    if (o.args) h += `<p class="fnh">${ru ? 'Что пишем в скобках' : 'Жақша ішіне не жазамыз'}</p>` + AR(o.args.map(([a, r, k]) => [a, ru ? r : k]));
    if (o.ex) h += `<p class="fnh">${ru ? 'Пример' : 'Мысал'}</p>` + o.ex.map(([f, r, k]) => `<div class="fnex"><code>${f}</code> → ${ru ? r : k}</div>`).join('');
    if (o.err) h += `<p class="fnh fnbad">${ru ? 'Частая ошибка' : 'Жиі қате'}</p><p>${o.err[lang]}</p>`;
    return h;
  };
  return {ru: P('ru'), kz: P('kz')};
};

  ex:[['=ИНДЕКС(B2:B11;3)','цена 3-го учебника','3-оқулықтың бағасы'],['=ИНДЕКС(B2:B11;ПОИСКПОЗ("Химия";A2:A11;0))','цена «Химии» — связка ИНДЕКС + ПОИСКПОЗ','«Химия» бағасы — ИНДЕКС + ПОИСКПОЗ байламы']]})}
];

const FN_STAR = {label: L('Сегодня','Бүгін'), names: ['СЦЕПИТЬ','СУММ','СРЗНАЧ','МАКС','МИН','ОКРУГЛ','ЕСЛИ','СЧЁТЕСЛИ','СЧЁТЗ']};
const isStar = f => FN_STAR.names ? (!!f.n && !f.key && FN_STAR.names.includes(f.n)) : !!f.star;

function openFuncs(){
  if (!CONFIG.SHOW_FUNCTION_HELP) return;
  const more = S.lang === 'kz' ? 'Толығырақ' : 'Подробнее', less = S.lang === 'kz' ? 'Жасыру' : 'Скрыть';
  const ins = S.lang === 'kz' ? 'Формулаға қою' : 'Вставить в формулу';
  const day3 = tr(FN_STAR.label);
  const list = () => { const q = ($('fnQ') ? $('fnQ').value : '').trim().toUpperCase();
    return FHELP.map((f, i) => ({f, i})).sort((a, b) => (isStar(b.f) - isStar(a.f)) || (a.i - b.i)).filter(({f}) => !q || (f.n && f.n.includes(q)) || (f.en && f.en.includes(q)) || tr(f.s).toUpperCase().includes(q) || (f.title && tr(f.title).toUpperCase().includes(q)))
      .map(({f, i}) => `<li data-i="${i}" class="${isStar(f) ? 'star' : ''}">`
        + `<div class="fnhead">${isStar(f) ? `<span class="fnstar">★ ${day3}</span>` : ''}<b>${f.title ? esc(tr(f.title)) : f.n}</b>${f.en && !f.title ? ` <small>(${f.en})</small>` : ''}`
        + (f.syn ? `<br><code>${esc(tr(f.syn))}</code>` : '') + `<br>${esc(tr(f.s))}</div>`
        + `<div class="fnbtns"><button type="button" class="fnmore">${more} ▾</button>${f.n ? `<button type="button" class="fnins">${ins}</button>` : ''}</div>`
        + `<div class="fndet" hidden>${tr(f.d)}</div></li>`).join(''); };
  modal(t('fnTitle'), `<p style="margin-top:0">${esc(t('fnOps'))}</p><input id="fnQ" class="fnsearch" placeholder="${t('search')}"><ul class="fnlist" id="fnL">${list()}</ul>`, [{label:t('close')}]);
  $('fnQ').addEventListener('input', () => { $('fnL').innerHTML = list(); });
  $('fnL').addEventListener('click', e => {
    const li = e.target.closest('li'); if (!li) return;
    const f = FHELP[+li.dataset.i];
    if (e.target.closest('.fndet')) return;
    if (e.target.closest('.fnmore') || !f.n || !e.target.closest('.fnins')){
      const det = li.querySelector('.fndet'), b = li.querySelector('.fnmore'); det.hidden = !det.hidden;
      b.textContent = (det.hidden ? more + ' ▾' : less + ' ▴'); li.classList.toggle('open', !det.hidden); return;
    }
    closeModal();
    if (!canEdit()) return;
    if (!ed) startEdit('enter', '=');
    const inp = ed.input; inp.focus(); const pos = caretOf(inp), v = inp.value, s = f.n + '(';
    inp.value = v.slice(0, pos) + s + v.slice(pos); syncFrom(inp); try { inp.setSelectionRange(pos + s.length, pos + s.length); } catch (x){} afterInput();
  });
}


/* ==================== ANTI-CHEAT ==================== */
let grace = 0;
const fsSupported = () => { const el = document.documentElement; return !!(el.requestFullscreen || el.webkitRequestFullscreen) && document.fullscreenEnabled !== false; };
const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
/* планшет/телефон: экранная клавиатура выбивает из полноэкранного режима и даёт blur — это не нарушение.
   Там полноэкранный режим не включаем; нарушение — только уход со страницы (другая вкладка/приложение). */
const TOUCH_DEV = (() => { try { return matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)); } catch (e){ return false; } })();
function enterFS(){
  grace = Date.now() + 1500; if (!CONFIG.ANTI_CHEAT || TOUCH_DEV) return;
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn){ try { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } catch (e){} }
}
function exitFS(){ try { if (inFS()){ const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) fn.call(document); } } catch (e){} }
function violation(type){
  if (!CONFIG.ANTI_CHEAT || !S.started || S.finished || S.locked) return;
  if (Date.now() < grace) return;
  if (!$('modal').hidden && $('pinIn')) return;
  S.violations.push({type, t:Date.now(), task:S.cur}); S.locked = true; S.lockReason = type;
  cancelEdit(); drag = null; save(); showLock(); updViol();
}
const onFSChange = () => { if (!TOUCH_DEV && !inFS() && fsSupported()) violation('fs'); };
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
window.addEventListener('blur', () => { if (!TOUCH_DEV) violation('blur'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) violation('hidden'); });
document.addEventListener('contextmenu', e => { if (S.started && !S.finished) e.preventDefault(); });
function showLock(){
  $('lkTitle').textContent = t('lockTitle');
  $('lkReason').textContent = t('r_' + (S.lockReason === 'fs' ? 'fs' : S.lockReason || 'blur'));
  $('lkCount').textContent = t('lockCount') + S.violations.length;
  const needPin = S.violations.length > S.freeUntil;
  $('lkPinWrap').hidden = !needPin; $('lkPinMsg').textContent = t('lockPin'); $('lkPinErr').textContent = ''; $('lkPin').value = '';
  $('lkBtn').textContent = needPin ? t('unlock') : t('lockCont');
  $('lock').hidden = false;
}
$('lkBtn').onclick = () => {
  if (S.violations.length > S.freeUntil){
    if ($('lkPin').value !== CONFIG.TEACHER_PIN){ $('lkPinErr').textContent = t('pinWrong'); return; }
    S.freeUntil = S.violations.length + CONFIG.MAX_FREE_RESUMES;
  }
  S.locked = false; S.lockReason = null; save(); $('lock').hidden = true; enterFS();
  setTimeout(() => { drawSel(); focusSink(); }, 300);
};
$('lkPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('lkBtn').click(); });
function updViol(){ const n = S.violations.length; $('viol').hidden = !n; $('viol').textContent = '⚠ ' + n; $('viol').title = t('violShort'); }

/* ==================== SCREENS ==================== */
function fmtDur(ms){ const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s % 3600/60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function applyI18n(){
  document.documentElement.lang = S.lang === 'kz' ? 'kk' : 'ru';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('#tools button').forEach(b => { const s = b.querySelector('span'); if (s) b.title = s.textContent; });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === S.lang));
  $('rules').innerHTML = t('rules').map(r => `<li>${r}</li>`).join('');
  $('fsWarn').textContent = (CONFIG.ANTI_CHEAT && !fsSupported() && !TOUCH_DEV) ? t('fsWarn') : '';
  $('btnFuncs').hidden = !CONFIG.SHOW_FUNCTION_HELP;
}
function setLang(l){
  S.lang = l; save(); applyI18n();
  if (!$('work').hidden){ if (ed) cancelEdit(); refresh(); renderPanel(); renderTabs(); updViol(); if (S.locked) showLock(); }
  if (!$('result').hidden) showResults();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
function showWork(){
  $('start').hidden = true; $('result').hidden = true; $('work').hidden = false;
  $('who').textContent = S.student ? S.student.name + ' · ' + S.student.cls : '';
  sel = SELS[S.cur]; buildGrid(); refresh(); renderPanel(); renderTabs(); updViol(); tick(); focusSink();
}
$('btnStart').onclick = () => {
  const name = $('stName').value.trim().replace(/\s+/g, ' '), cls = $('stClass').value.trim();
  if (name.length < 3 || !cls){ $('startErr').textContent = t('errName'); return; }
  S.student = {name, cls}; S.started = true; S.startTime = Date.now(); S.finished = false; S.locked = false; save();
  enterFS(); showWork();
};
$('btnPanel').onclick = () => { $('panel').classList.toggle('closed'); setTimeout(drawSel, 0); };
$('btnFinish').onclick = () => {
  if (ed && !commitEdit()) return;
  modal(t('finishQ'), `<p>${t('finishText')}</p>`, [{label:t('cancel')}, {label:t('yes'), cls:'primary', onClick:() => { setTimeout(finish, 0); }}]);
};
function finish(){
  if (S.finished) return; cancelEdit();
  TASKS.forEach((_, i) => { S.sheets[i].result = runChecks(i); });
  S.finished = true; S.locked = false; S.endTime = Date.now(); save();
  $('lock').hidden = true; exitFS(); showResults();
}
function totals(){ let p = 0; const tot = TASKS.length*TASK_MAX; S.sheets.forEach(s => { if (s.result) p += s.result.pts; }); p = Math.round(p*100)/100; const pct = Math.round(p/tot*100); return {p, tot, pct, grade: pct >= 85 ? 5 : pct >= 65 ? 4 : pct >= 40 ? 3 : 2}; }
function showResults(){
  $('start').hidden = true; $('work').hidden = true; $('result').hidden = false;
  const T = totals(), d = new Date(S.endTime || Date.now());
  const rows = TASKS.map((tk, i) => { const r = S.sheets[i].result || {pts:0, total:TASK_MAX}; const pc = Math.round(r.pts/r.total*100);
    return `<tr><td>${i + 1}</td><td>${esc(tr(tk.title))}</td><td class="n">${fmtPts(r.pts)} / ${r.total}</td><td style="width:30%"><div class="bar"><i style="width:${pc}%"></i></div></td><td class="n">${pc}%</td></tr>`; }).join('');
  const vl = S.violations.length ? `<div class="viol"><b>${t('resViol')}: ${S.violations.length}</b><br>` + S.violations.map(v => `${new Date(v.t).toLocaleTimeString()} — ${t('vt_' + v.type)} (${t('task')} ${v.task + 1})`).join('<br>') + '</div>' : `<div class="viol none">✓ ${t('resNone')}</div>`;
  $('result').innerHTML = `<div class="card rescard">
    <div class="start-top"><div class="langs"><button data-lang="ru">RU</button><button data-lang="kz">ҚАЗ</button></div></div>
    <div class="res-head"><span class="xl">X</span><div><h1>${t('resTitle')}</h1><p>${esc(S.student ? S.student.name : '')} · ${esc(S.student ? S.student.cls : '')}</p></div><div class="grade g${T.grade}" title="${t('resGrade')}">${T.grade}</div></div>
    <div class="res-meta"><span>${t('resDate')}: <b>${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0, 5)}</b></span><span>${t('resTime')}: <b>${fmtDur((S.endTime || Date.now()) - S.startTime)}</b></span><span>${t('resTotal')}: <b>${fmtPts(T.p)} / ${T.tot} (${T.pct}%)</b></span></div>
    <table class="restab"><tr><th>#</th><th>${t('resTask')}</th><th class="n">${t('resScore')}</th><th></th><th class="n">%</th></tr>${rows}
    <tr class="tot"><td></td><td>${t('resTotal')}</td><td class="n">${fmtPts(T.p)} / ${T.tot}</td><td></td><td class="n">${T.pct}%</td></tr></table>
    ${vl}
    <div class="res-btns"><button class="btn primary" id="btnDl">${t('download')}</button><button class="btn" id="btnNew">${t('newStudent')}</button></div></div>`;
  $('result').querySelectorAll('[data-lang]').forEach(b => { b.classList.toggle('on', b.dataset.lang === S.lang); b.onclick = () => setLang(b.dataset.lang); });
  $('btnDl').onclick = downloadReport;
  $('btnNew').onclick = () => askPin(resetAll);
}
function downloadReport(){
  const T = totals(), d = new Date(S.endTime || Date.now());
  const lines = [t('appTitle') + ' — ' + t('resTitle'), '', t('lblName') + ': ' + (S.student ? S.student.name : ''), t('lblClass') + ': ' + (S.student ? S.student.cls : ''),
    t('resDate') + ': ' + d.toLocaleString(), t('resTime') + ': ' + fmtDur((S.endTime || Date.now()) - S.startTime), ''];
  TASKS.forEach((tk, i) => { const r = S.sheets[i].result || {pts:0, total:TASK_MAX, items:[]}; lines.push(`${t('task')} ${i + 1}. ${tr(tk.title)}: ${fmtPts(r.pts)}/${r.total}`);
    (r.items || []).forEach((it, j) => { const vw = itemView(it); lines.push(`   [${fmtPts(it.pts || 0)}/${fmtPts(tk.checks[j].p)}] ${tk.checks[j].cells} ${tr(tk.checks[j].name)}: ${vw.msg}`); }); });
  lines.push('', `${t('resTotal')}: ${fmtPts(T.p)}/${T.tot} (${T.pct}%) · ${t('resGrade')}: ${T.grade}`, `${t('resViol')}: ${S.violations.length}`);
  S.violations.forEach(v => lines.push(`   ${new Date(v.t).toLocaleTimeString()} — ${t('vt_' + v.type)} (${t('task')} ${v.task + 1})`));
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'Excel_' + (S.student ? S.student.name.replace(/[^\wА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]+/g, '_') : 'result') + '.txt';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function resetAll(){
  const lang = S.lang; S0 = {lang}; S = fresh(); save();
  TASKS.forEach((_, i) => { UNDO[i] = []; REDO[i] = []; });
  $('stName').value = ''; $('stClass').value = '';
  $('result').hidden = true; $('work').hidden = true; $('lock').hidden = true; $('start').hidden = false; applyI18n(); toast(t('resetDone'), 'ok');
}
$('btnTeacher').onclick = () => askPin(() => {
  const fnName = x => RU_NAME[x] || x;
  const rubric = tk => '<table class="rub">' + tk.checks.map(ch => `<tr><td><code>${ch.cells}</code></td><td>${esc(tr(ch.name))}</td><td class="n"><b>${fmtPts(ch.p)}</b></td><td>${
    ch.kind === 'same' ? t('rubricOne') : [ch.want ? ch.want.map(g => g.map(fnName).join(' / ')).join(' + ') : '', ch.uniform !== false && addrs(ch.cells).length >= 3 ? t('rubricFill') : ''].filter(Boolean).join('; ') || '—'}</td></tr>`).join('') + '</table>';
  const body = `<p class="tiny" style="margin-top:0">${t('rubricNote')}</p>` + TASKS.map((tk, i) => `<b>${t('task')} ${i + 1}. ${esc(tr(tk.title))} — 10</b>${rubric(tk)}<div class="sol">${tk.sol.map(([r, f]) => r + ':  ' + esc(f)).join('\n')}</div>`).join('');
  modal(t('solTitle'), body, [{label:t('resetAll'), onClick:() => { resetAll(); }}, {label:t('close'), cls:'primary'}]);
});

/* timer */
function tick(){
  if (!S.started || S.finished || $('work').hidden) return;
  const el = Date.now() - S.startTime;
  if (CONFIG.TIME_LIMIT_MIN > 0){ const left = CONFIG.TIME_LIMIT_MIN*60000 - el; $('timer').textContent = t('timeLeft') + ' ' + fmtDur(left); if (left <= 0){ finish(); toast(t('timeUp')); } }
  else $('timer').textContent = '⏱ ' + fmtDur(el);
}
setInterval(tick, 1000);
window.addEventListener('resize', () => { if (!$('work').hidden && TD.length){ drawSel(); updRefBoxes(); } });
$('gridWrap').addEventListener('dragstart', e => e.preventDefault());

/* ==================== INIT ==================== */
applyI18n();
if (!S.started) { $('start').hidden = false; }
else if (S.finished) showResults();
else {
  showWork();
  if (CONFIG.ANTI_CHEAT){
    if (!S.locked){ S.violations.push({type:'reload', t:Date.now(), task:S.cur}); S.locked = true; S.lockReason = 'reload'; save(); }
    updViol(); showLock();
  }
}

if (/[?&]debug\b/.test(location.search)) window.__xp = {get S(){ return S; }, TASKS, runChecks, shiftFormula, normalizeFormula, makeCtx, refresh, goSheet, setCells, evalFormula, P, A, addrs,
  applySol(i){ const tk = TASKS[i], s = S.sheets[i]; tk.sol.forEach(([rs, f]) => { const list = addrs(rs), p0 = P(list[0]); list.forEach(a => { const p = P(a); s.cells[a] = shiftFormula(normalizeFormula(f), p.r - p0.r, p.c - p0.c); }); }); }};
})();
</script>
